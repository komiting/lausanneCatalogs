# ─────────────────────────────────────────────────────────────────────────────
# KORPA — proizvodi čije cene sajt prati u svim prodavnicama.
#
# Za svaki proizvod:
#   id       kratak identifikator (bez razmaka, ne menjaj ga posle — veže istoriju)
#   name     naziv koji se prikazuje na sajtu
#   group    grupa na sajtu
#   unit     jedinica poređenja: "kg", "l" ili "pc" (komad)
#   query    pojam za pretragu na francuskom (Migros i Coop)
#   queries  (opciono) drugačiji pojmovi za pojedine prodavnice, npr. { coop = ["..."] }
#   include  lista regex izraza — naziv proizvoda mora da sadrži SVAKI od njih
#   exclude  regex — proizvod se preskače ako naziv ili kategorija sadrže nešto od ovoga
#   min_qty / max_qty  (opciono) granice veličine pakovanja u izabranoj jedinici
#   note     (opciono) napomena koja se vidi na sajtu
#
# Pravila ne razlikuju velika/mala slova i ignorišu akcente (é = e, œ = oe).
# Svakog dana se za svaku prodavnicu bira proizvod sa NAJNIŽOM cenom po jedinici.
# ─────────────────────────────────────────────────────────────────────────────

