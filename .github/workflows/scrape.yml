name: Preuzmi cene

on:
  schedule:
    # 04:40 UTC = 06:40 in Lausanne (summer) / 05:40 (winter)
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "Samo ove prodavnice (npr. migros,coop). Prazno = sve."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scrape
        env:
          TZ: Europe/Zurich
          STORES: ${{ inputs.stores }}
        run: |
          if [ -n "$STORES" ]; then
            python -m scraper run --stores "$STORES"
          else
            python -m scraper run
          fi

      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nema promena."
          else
            git commit -m "Cene $(TZ=Europe/Zurich date +%F)"
            git pull --rebase --autostash
            git push
          fi
